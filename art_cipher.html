<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Art Cipher Playground</title>
<style>
:root{--bg:#14110f;--fg:#f1e9dc;--card:#201c19;--ac:#e8452c;--mu:#9a8f80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Georgia,serif;padding:20px;max-width:1000px;margin:auto}
h1{font-weight:400;letter-spacing:.04em;margin:.2em 0}h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.15em;color:var(--mu);font-weight:400;margin:28px 0 8px}
textarea{width:100%;min-height:80px;background:var(--card);color:var(--fg);border:1px solid #3a332d;border-radius:8px;padding:10px;font:inherit}
button{background:var(--card);color:var(--fg);border:1px solid #3a332d;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit}button:hover{border-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:60px;background:var(--card);border-radius:8px;padding:10px}
.t{width:52px;height:64px;border-radius:5px;background:#000 center/cover;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff}
.t.n{background:#2d2622;border:1px solid #4a3f37;font-family:"Noto Serif SC","SimSun",serif}
.sp{width:22px}.ch{font-size:1.4rem;color:var(--mu);padding:0 2px}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.k{text-align:center;cursor:pointer;background:var(--card);border-radius:8px;padding:6px 4px}.k:hover{outline:1px solid var(--ac)}
.k .t{margin:0 auto 4px}.k b{font-size:1.1rem}
.out{font-size:1.5rem;letter-spacing:.12em;min-height:40px;word-break:break-all}
.bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}small{color:var(--mu)}
</style></head><body>

let map=[...S.keys()];let buf=[];
const $=id=>document.getElementById(id);
function tile(s,cls=""){const d=document.createElement("div");d.className="t "+(s.t=="n"?"n ":"")+cls;if(s.t=="i")d.style.backgroundImage=`url(${s.v})`;else d.textContent=s.v;return d}
function enc(){const e=$("enc");e.innerHTML="";let txt="";
for(const c of $("p").value.toUpperCase()){const i=A.indexOf(c);
if(i>=0){const s=S[map[i]];e.appendChild(tile(s));txt+=s.t=="n"?s.v:"□"}
else if(c==" "||c=="\n"){const d=document.createElement("div");d.className="sp";e.appendChild(d);txt+=" "}
else{const d=document.createElement("span");d.className="ch";d.textContent=c;e.appendChild(d);txt+=c}}}
function dec(){const r=$("dec");r.innerHTML="";let o="";
buf.forEach(b=>{if(b==-1){const d=document.createElement("div");d.className="sp";r.appendChild(d);o+=" "}else{r.appendChild(tile(S[map[b]]));o+=A[b]}});$("plain").textContent=o}
function key(){const k=$("key");k.innerHTML="";
A.split("").forEach((l,i)=>{const d=document.createElement("div");d.className="k";d.appendChild(tile(S[map[i]]));d.insertAdjacentHTML("beforeend",`<b>${l}</b>`);d.onclick=()=>{buf.push(i);dec()};k.appendChild(d)})}
function all(){enc();dec();key()}
$("p").oninput=enc;
$("sp").onclick=()=>{buf.push(-1);dec()};$("bs").onclick=()=>{buf.pop();dec()};$("cl").onclick=()=>{buf=[];dec()};
$("sh").onclick=()=>{for(let i=map.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[map[i],map[j]]=[map[j],map[i]]}all()};
$("rs").onclick=()=>{map=[...S.keys()];all()};
$("cp").onclick=()=>{let t="";for(const c of $("p").value.toUpperCase()){const i=A.indexOf(c);t+=i>=0?(S[map[i]].t=="n"?S[map[i]].v:"["+(map[i]+1)+"]"):c}navigator.clipboard.writeText(t)};
const imgCache={};
function load(src){return imgCache[src]||(imgCache[src]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src}))}
$("png").onclick=async()=>{
const W=104,H=128,G=12,SP=44,PAD=40,MAXW=1400,LH=H+G;
const items=[];for(const c of $("p").value.toUpperCase()){const i=A.indexOf(c);
if(i>=0)items.push({k:"s",s:S[map[i]],w:W});else if(c=="\n")items.push({k:"nl"});else if(c==" ")items.push({k:"sp",w:SP});else items.push({k:"c",c,w:40})}
if(!items.length)return;
const pos=[];let x=PAD,y=PAD,maxX=PAD+W;
for(const it of items){
if(it.k=="nl"){x=PAD;y+=LH;continue}
if(x+it.w>MAXW-PAD&&x>PAD){x=PAD;y+=LH}
pos.push([it,x,y]);x+=it.w+G;maxX=Math.max(maxX,x-G+PAD)}
const cv=document.createElement("canvas");cv.width=Math.max(maxX,W+2*PAD);cv.height=y+H+PAD;
const g=cv.getContext("2d");g.fillStyle="#14110f";g.fillRect(0,0,cv.width,cv.height);
for(const [it,px,py] of pos){
if(it.k=="s"){const s=it.s;
if(s.t=="i"){const im=await load(s.v);const sc=Math.max(W/im.width,H/im.height),dw=im.width*sc,dh=im.height*sc;
g.save();g.beginPath();g.roundRect(px,py,W,H,8);g.clip();g.drawImage(im,px+(W-dw)/2,py+(H-dh)/2,dw,dh);g.restore()}
else{g.fillStyle="#2d2622";g.strokeStyle="#4a3f37";g.lineWidth=2;g.beginPath();g.roundRect(px,py,W,H,8);g.fill();g.stroke();
g.fillStyle="#fff";g.font=(s.v.length>1?46:64)+'px "Noto Serif SC","SimSun",serif';g.textAlign="center";g.textBaseline="middle";g.fillText(s.v,px+W/2,py+H/2)}}
else if(it.k=="c"){g.fillStyle="#9a8f80";g.font="48px Georgia,serif";g.textAlign="center";g.textBaseline="alphabetic";g.fillText(it.c,px+20,py+H-20)}}
const a=document.createElement("a");a.download="encoded-message.png";a.href=cv.toDataURL("image/png");a.click()};
all();
</script></body></html>
